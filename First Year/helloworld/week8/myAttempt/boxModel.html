<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="../css/customCss.css"> -->
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            background-color: lightcoral;
        }

        .box {
            width: 300px;
            height: 150px;
            background-color: navy;
            color: white;
            padding: 50px;
            border: darkcyan 15px solid;
            border-radius: 50px;
            margin-top: 10px;
            
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <!-- <p> This is a block element with an <strong> inline element </strong></p> -->
    <p class="box">This is a box</p>


</body>

</html>
