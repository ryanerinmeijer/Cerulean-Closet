<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        body{
            background-color: grey;
        }
        h1 {
            color: red;
        }

        h2 {
            color: #ff0000;
        }

        h3 {
            color: rgb(255, 0, 0);
        }
        h4{
            color: rgba(255, 0, 0,0.5);
        }
    </style>
</head>

<body>
    <h1>This is from colour keywords</h1>
    <h2>This is from hex codes</h2>
    <h3>This is from rgb codes</h3>
    <h4> This is from rgb alpha codes (transparency) </h4>
</body>

</html>
