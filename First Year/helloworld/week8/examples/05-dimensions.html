<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dimensions</title>
  <style>
    * {
      box-sizing: border-box;
    }

    /* Relative dimensions using percentages */
    .container {
      width: 50%;
      border: 2px solid black;
      margin-bottom: 16px;
      padding: 8px;
    }

    /* Fixed dimensions using pixels */
    .box-px {
      width: 200px;
      height: 80px;
      background-color: lightblue;
      margin-bottom: 12px;
    }

    /* Relative dimensions using percentages */
    .box-percent {
      width: 50%;
      height: 60px;
      background-color: lightgreen;
    }
  </style>
</head>
<body>
  <h1>Dimensions Demo</h1>
  <p>Examples of width and height using <code>px</code> and <code>%</code>.</p>

  <div class="container">
    <div class="box-px">width: 200px; height: 80px;</div>
    <div class="box-percent">width: 50%; height: 60px;</div>
    <a href="06-hyperlinks.html">Next Page</a>
  </div>
</body>
</html>
