<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with dbConnector.php</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- The page wrapper keeps the banner, navigation and page content together. -->
  <div class="page">
    <!-- The banner explains what this example is demonstrating. -->
    <div class="banner">
      <h1>Working with <code>dbConnector.php</code></h1>
      <p>SELECT and DELETE Example</p>
    </div>

    <!-- Navigation links let students switch between the different examples. -->
    <div class="nav">
      <a href="01-addRecord.html">Add Record</a> |
      <a href="02-deleteRecords.html">Delete Records</a> |
      <a href="03-editRecords.html">Edit Records</a> |
      <a href="04-editDeleteRecords.html">Edit/Delete Records</a> |
      <a href="05-chartMarks.html">Chart Marks</a> |
      <a href="06-chartMarksRange.html">Chart Marks Range</a>
    </div>

    <!-- The main content area shows the records table and feedback messages. -->
    <div class="main">
      <h2>Browse and Delete Records</h2>
      <p>The table below shows all students. Click delete to remove a record.</p>
      <br>
      <hr>
      <br>
      <!-- JavaScript builds the table and inserts it into this empty div. -->
      <div id="tableOutput"></div>
      <br>
      <!-- Success or error messages are shown here. -->
      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="js/myJs.js"></script>
  <script>
    // Display a message after a delete action or database problem.
    const showMessage = (text, type) => {
      const output = document.querySelector("#message");
      output.textContent = text;
      output.className = `message ${type}`;
    };

    // Read all students from the database and draw them as an HTML table.
    const printTable = async () => {
      const output = document.querySelector("#tableOutput");
      output.textContent = "";

      // Select every student so we can display the whole table.
      const sql = "SELECT * FROM students ORDER BY studentID;";
      const result = await runQuery(sql);

      if (!result || !result.data || result.data.length === 0) {
        output.textContent = "No Rows Returned";
        return;
      }

      const rows = result.data;
      const table = document.createElement("table");
      const headerRow = document.createElement("tr");
      table.appendChild(headerRow);

      // These headings become the top row of the table.
      const headings = ["Student ID", "First Name", "Last Name", "Course", "Mark", "Action"];

      for (let heading of headings) {
        const th = document.createElement("th");
        th.textContent = heading;
        headerRow.appendChild(th);
      }

      for (let row of rows) {
        const tr = document.createElement("tr");

        const tdStudentId = document.createElement("td");
        tdStudentId.textContent = row.studentID;
        tr.appendChild(tdStudentId);

        const tdFirstName = document.createElement("td");
        tdFirstName.textContent = row.firstName;
        tr.appendChild(tdFirstName);

        const tdLastName = document.createElement("td");
        tdLastName.textContent = row.lastName;
        tr.appendChild(tdLastName);

        const tdCourse = document.createElement("td");
        tdCourse.textContent = row.course;
        tr.appendChild(tdCourse);

        const tdMark = document.createElement("td");
        tdMark.textContent = row.mark;
        tr.appendChild(tdMark);

        const tdDelete = document.createElement("td");
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", async () => {
          // Ask the user to confirm before removing a row from the database.
          const shouldDelete = confirm(`Delete student ${row.studentID}?`);
          if (!shouldDelete) {
            return;
          }

          // Delete the selected row by matching its student ID.
          const deleteSql = `DELETE FROM students WHERE studentID = ${row.studentID}`;
          const deleteResult = await runQuery(deleteSql);

          if (deleteResult && deleteResult.success) {
            showMessage("Student record deleted successfully.", "success");
            printTable();
            return;
          }

          if (deleteResult && deleteResult.error) {
            showMessage(deleteResult.error, "error");
          } else {
            showMessage("Unable to delete the record.", "error");
          }
        });
        tdDelete.appendChild(deleteButton);
        tr.appendChild(tdDelete);

        table.appendChild(tr);
      }

      output.appendChild(table);
    };

    // Build the table as soon as the page has finished loading.
    document.addEventListener("DOMContentLoaded", () => {
      printTable();
    });
  </script>
</body>

</html>
