<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Line Chart</title>
  <style>
    /* Basic page styling keeps the chart centred and easy to read. */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .page {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: #52606d;
      line-height: 1.5;
    }

    .chart-wrapper {
      height: 420px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="panel">
      <h1>Average Mark Trend</h1>
      <p>A line chart showing how the class average changed from week to week.</p>
      <div class="chart-wrapper">
        <!-- Chart.js draws the line chart inside this canvas. -->
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Get the canvas element where the chart should be drawn.
    const ctx = document.getElementById("myChart");

    // Create a line chart to show the change in average marks over time.
    new Chart(ctx, {
      type: "line",
      data: {
        // Labels appear along the x-axis.
        labels: ["Week 1", "Week 2", "Week 3", "Week 4", "Week 5"],
        datasets: [{
          label: "Average Mark",
          // Each number becomes one point on the line.
          data: [52, 58, 61, 67, 72],
          fill: false,
          tension: 0.2,
          borderColor: "#1d4ed8",
          backgroundColor: "#1d4ed8",
          pointRadius: 4,
          pointHoverRadius: 6
        }]
      },
      options: {
        // These options control the sizing and y-axis scale.
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            ticks: {
              stepSize: 20
            }
          }
        }
      }
    });
  </script>
</body>

</html>
