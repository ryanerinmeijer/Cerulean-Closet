<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Bar Chart</title>
  <style>
    /* Basic page styling keeps the chart centred and easy to read. */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .page {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: #52606d;
      line-height: 1.5;
    }

    .chart-wrapper {
      height: 420px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="panel">
      <h1>Student Confidence</h1>
      <p>A simple bar chart showing confidence levels in HTML, CSS, and JavaScript.</p>
      <div class="chart-wrapper">
        <!-- Chart.js will draw the chart inside this canvas element. -->
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Get the canvas element that will hold the chart.
    const ctx = document.getElementById("myChart");

    // Create a bar chart using hard-coded sample data.
    new Chart(ctx, {
      type: "bar",
      data: {
        // Labels appear along the x-axis.
        labels: ["HTML", "CSS", "JS"],
        datasets: [{
          label: "Student Confidence",
          // The numbers decide the height of each bar.
          data: [8, 6, 4],
          backgroundColor: ["#d62828", "#f77f00", "#003049"],
          borderRadius: 8
        }]
      },
      options: {
        // These options control how the chart behaves and is displayed.
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: false
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 10,
            ticks: {
              stepSize: 2
            }
          }
        }
      }
    });
  </script>
</body>

</html>
