<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart Confidence Example</title>
</head>

<body>
  <!-- Chart.js will draw the chart inside this canvas element. -->
  <canvas id="myChart"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Get a reference to the canvas so Chart.js knows where to draw.
    const ctx = document.getElementById("myChart");

    // Create a simple pie chart using hard-coded example data.
    new Chart(ctx, {
      type: "pie",
      data: {
        // The labels describe what each slice of the pie represents.
        labels: ["HTML", "CSS", "JS"],
        datasets: [{
          label: "Student Confidence",
          // These numbers decide the size of each slice.
          data: [8, 6, 4]
        }]
      }
    });
  </script>
</body>

</html>
