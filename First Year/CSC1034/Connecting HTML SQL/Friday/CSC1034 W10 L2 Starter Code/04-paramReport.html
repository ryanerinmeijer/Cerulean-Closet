    const printTable = async () => {

      const table = document.createElement("table");
      const headerRow = document.createElement("tr");

      const thStudentId = document.createElement("th");
      const thFirstName = document.createElement("th");
      const thLastName = document.createElement("th");

      thStudentId.textContent = "Student ID";
      thFirstName.textContent = "First Name";
      thLastName.textContent = "Last Name";

      headerRow.appendChild(thStudentId);
      headerRow.appendChild(thFirstName);
      headerRow.appendChild(thLastName);

      table.appendChild(headerRow);

      for (let row of rows) {
        const tr = document.createElement("tr");

        const tdStudentId = document.createElement("td");
        const tdFirstName = document.createElement("td");
        const tdLastName = document.createElement("td");

        tdStudentId.textContent = row.studentID;
        tdFirstName.textContent = row.firstName;
        tdLastName.textContent = row.lastName;

        tr.appendChild(tdStudentId);
        tr.appendChild(tdFirstName);
        tr.appendChild(tdLastName);

        table.appendChild(tr);
      }

      output.appendChild(table);
    }
